name: cargo_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  go_router: ^13.2.0
  http: ^1.2.1
  geolocator: ^14.0.2
  provider: ^6.1.5+1
  image_picker: ^1.2.1
  shared_preferences: ^2.5.3
  flutter_image_compress: ^2.4.0
  gal: ^2.3.2
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  lottie: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/


# Perbaiki konfigurasi (ganti flutter_icons menjadi flutter_launcher_icons)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/naga_cargo.png"
  min_sdk_android: 21

  # Fix warning iOS alpha channel
  remove_alpha_ios: true

  # Untuk Android adaptive icon
  adaptive_icon_background: "#4A90E2"
  adaptive_icon_foreground: "assets/images/logo.png"

  # Tambahkan platform yang jelas
  platforms:
    android:
      enable: true
      image_path: "assets/images/naga_cargo.png"
      adaptive_icon_background: "#4A90E2"
      adaptive_icon_foreground: "assets/images/naga_cargo.png"
    ios:
      enable: true
      image_path: "assets/images/naga_cargo.png"
      remove_alpha_channel: true
